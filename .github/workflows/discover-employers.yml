name: Discover employers

# Once a month (the 2nd, 18:00 UTC) and on demand. Finds new employers' job boards, then re-checks broken ones.
# Nothing is committed to the repository: results go to the database, the run log and a downloadable report.
on:
  schedule:
    - cron: "0 18 2 * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: look and report, save nothing"
        type: boolean
        default: false
      limit:
        description: "Only look at this many new candidates (leave empty for all)"
        required: false

concurrency:
  group: discover-employers
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Unit tests
        run: node --test
      - name: Discover
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DRY: ${{ github.event.inputs.dry_run }}
          LIMIT: ${{ github.event.inputs.limit }}
        run: |
          ARGS=""
          if [ "$DRY" = "true" ]; then ARGS="$ARGS --dry"; fi
          if [ -n "$LIMIT" ]; then ARGS="$ARGS --limit $LIMIT"; fi
          node jobs-import/discover.mjs $ARGS
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discovery-report
          path: data/discovery-report.md
          if-no-files-found: ignore
