name: Import jobs

# Every Sunday at 16:00 UTC (about 3am Monday in Sydney; it drifts an hour with daylight saving).
# "Run workflow" on the Actions tab runs it by hand.
on:
  schedule:
    - cron: "0 16 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: fetch and count, write nothing"
        type: boolean
        default: false

concurrency:
  group: import-jobs
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Unit tests
        run: node --test
      - name: Import
        # The job fails (and GitHub emails you) if every source failed.
        run: node jobs-import/import-jobs.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          ADZUNA_MAX_CALLS_PER_RUN: ${{ vars.ADZUNA_MAX_CALLS_PER_RUN || '200' }}
          JOOBLE_MAX_CALLS_PER_RUN: ${{ vars.JOOBLE_MAX_CALLS_PER_RUN || '200' }}
          MAX_AGE_DAYS: ${{ vars.MAX_AGE_DAYS || '30' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
