name: Add or manage an employer

# A form: Actions tab > "Add or manage an employer" > Run workflow.
# To add: paste the careers page address (or a board address such as https://jobs.lever.co/acme). The first run only LOOKS and shows what it found;
# run it again with "Save it" ticked to add it.
# To pause, resume or remove: choose the action and type the employer's name or number.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "What to do"
        type: choice
        options: [add, pause, resume, remove]
        default: add
      careers_url:
        description: "For add: the careers page or company website"
        required: false
      name:
        description: "For add: the company name (optional). For pause, resume or remove: the employer's name or number"
        required: false
      save:
        description: "For add: tick to save it (leave unticked to just look)"
        type: boolean
        default: false

jobs:
  employer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Run
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ACTION: ${{ github.event.inputs.action }}
          URL_IN: ${{ github.event.inputs.careers_url }}
          NAME_IN: ${{ github.event.inputs.name }}
          SAVE: ${{ github.event.inputs.save }}
        run: |
          set -e
          if [ "$ACTION" = "add" ]; then
            test -n "$URL_IN" || { echo "Paste the careers page address in 'careers_url'."; exit 1; }
            if [ "$SAVE" = "true" ]; then SAVE_FLAG="--save"; else SAVE_FLAG=""; fi
            if [ -n "$NAME_IN" ]; then node jobs-import/add-employer.mjs "$URL_IN" --name "$NAME_IN" $SAVE_FLAG; else node jobs-import/add-employer.mjs "$URL_IN" $SAVE_FLAG; fi
          else
            test -n "$NAME_IN" || { echo "Type the employer's name or number in 'name'."; exit 1; }
            node jobs-import/add-employer.mjs "--$ACTION" "$NAME_IN"
          fi
