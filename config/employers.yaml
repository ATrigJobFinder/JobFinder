# Employers whose public job feeds are imported every week.
#
# ats: greenhouse | lever | lever_eu | ashby | workable | smartrecruiters | recruitee
# token: the company's board name in that hiring system (see docs/jobs-import.md, "Add an employer")
# active: false pauses an employer without deleting the line
# all: true keeps every Australian job, not just engineering ones
#
# Test one before adding it:
#   node jobs-import/import-jobs.mjs --check-employer greenhouse examplecompany

